name: Personal activity
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      reconcile:
        description: Recheck all 30 UTC dates
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: personal-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      labels: ${{ steps.collect.outputs.labels }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts
      - name: Locate the previous valid public snapshot
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/refresh-profile.yml/runs?branch=main&status=success&per_page=1")
          run=$(jq -r '.workflow_runs[0].id // empty' <<< "$runs")
          artifact=""
          if [[ -n "$run" ]]; then
            results=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=personal-aggregates")
            artifact=$(jq -r '.artifacts[] | select(.name == "personal-aggregates" and .expired == false) | .id' <<< "$results")
          fi
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Read previous aggregate counters
        if: steps.previous.outputs.artifact != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.previous.outputs.artifact }}
        run: |
          set -eu
          mkdir previous
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/prior.zip"
          unzip -p "$RUNNER_TEMP/prior.zip" aggregate.json > previous/aggregate.json
      - name: Collect and validate sanitized totals
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_ACTIVITY_READ_TOKEN: ${{ secrets.PROFILE_ACTIVITY_READ_TOKEN }}
          PROFILE_ACTIVITY_ORG_READ_TOKEN: ${{ secrets.PROFILE_ACTIVITY_ORG_READ_TOKEN }}
          FULL_RECONCILE: ${{ inputs.reconcile }}
        run: python3 scripts/activity.py
      - name: Save only the validated aggregate counters
        uses: actions/upload-artifact@v4
        with:
          name: personal-aggregates
          path: output/aggregate.json
          if-no-files-found: error
          retention-days: 14
  public-display:
    needs: refresh
    name: ${{ matrix.label }}
    permissions: {}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        label: ${{ fromJSON(needs.refresh.outputs.labels) }}
    steps:
      - run: echo 'Validated aggregate shown in this public job title.'
