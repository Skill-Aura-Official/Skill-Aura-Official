name: Personal work history
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      reconcile:
        description: Reconcile all retrievable history
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: personal-work-history
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate collector and public privacy boundaries
        run: python3 -m unittest discover -s scripts -p 'test_history*.py'
      - name: Read private history checkpoint
        env:
          PROFILE_PUBLISH_TOKEN: ${{ secrets.PROFILE_PUBLISH_TOKEN }}
        run: python3 scripts/history_publish.py pull "$RUNNER_TEMP/history-previous.json"
      - name: Collect available history without logging private records
        env:
          PROFILE_ACTIVITY_READ_TOKEN: ${{ secrets.PROFILE_ACTIVITY_READ_TOKEN }}
          PROFILE_ACTIVITY_ORG_READ_TOKEN: ${{ secrets.PROFILE_ACTIVITY_ORG_READ_TOKEN }}
          SKILLAURA_PROFILE_TOKEN: ${{ secrets.SKILLAURA_PROFILE_TOKEN }}
          FULL_RECONCILE: ${{ github.event_name == 'workflow_dispatch' && inputs.reconcile }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          mode=incremental
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$FULL_RECONCILE" == true ]]; then
            args+=(--full)
            mode=full
          fi
          printf 'Profile collection event=%s mode=%s\n' "$GITHUB_EVENT_NAME" "$mode"
          python3 scripts/history.py --previous "$RUNNER_TEMP/history-previous.json" --output "$RUNNER_TEMP/history-inventory.json" "${args[@]}"
      - name: Publish private checkpoint and sanitized public data
        env:
          PROFILE_PUBLISH_TOKEN: ${{ secrets.PROFILE_PUBLISH_TOKEN }}
        run: python3 scripts/history_publish.py publish "$RUNNER_TEMP/history-inventory.json"
