name: Refresh profile metrics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate profile from approved repository data
        run: npm run generate
        env:
          PROFILE_DATA_TOKEN: ${{ secrets.SKILLAURA_PROFILE_TOKEN }}

      - name: Validate generated profile
        run: npm run validate

      - name: Commit changed generated files
        shell: bash
        run: |
          if git diff --quiet -- README.md assets data/stats.json; then
            echo "Profile data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/hero.svg assets/engineering-stats.svg assets/activity.svg assets/languages.svg data/stats.json
          git commit -m "chore: refresh profile data"
          git push
