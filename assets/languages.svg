    <text x="925" y="14" class="pct">2.5%</text>
  </g><g transform="translate(28 246)">
    <text x="0" y="14" class="lang">PLpgSQL</text>
    <rect x="145" y="0" width="760" height="17" rx="8" fill="#1e293b"/>
    <rect x="145" y="0" width="7.6" height="17" rx="8" fill="#ca8a04"/>
    <text x="925" y="14" class="pct">1.0%</text>
  </g><g transform="translate(28 284)">
    <text x="0" y="14" class="lang">HTML</text>
    <rect x="145" y="0" width="760" height="17" rx="8" fill="#1e293b"/>
    <rect x="145" y="0" width="3.0" height="17" rx="8" fill="#ea580c"/>
    <text x="925" y="14" class="pct">0.2%</text>
  </g><g transform="translate(28 322)">
    <text x="0" y="14" class="lang">Shell</text>
    <rect x="145" y="0" width="760" height="17" rx="8" fill="#1e293b"/>
    <rect x="145" y="0" width="3.0" height="17" rx="8" fill="#db2777"/>
    <text x="925" y="14" class="pct">0.2%</text>
  </g><g transform="translate(28 360)">
    <text x="0" y="14" class="lang">Other</text>
