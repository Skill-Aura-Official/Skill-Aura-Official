    <text x="925" y="14" class="pct">30.9%</text>
  </g><g transform="translate(28 170)">
    <text x="0" y="14" class="lang">JavaScript</text>
    <rect x="145" y="0" width="760" height="17" rx="8" fill="#1e293b"/>
    <rect x="145" y="0" width="88.7" height="17" rx="8" fill="#0891b2"/>
    <text x="925" y="14" class="pct">11.7%</text>
  </g><g transform="translate(28 208)">
    <text x="0" y="14" class="lang">CSS</text>
    <rect x="145" y="0" width="760" height="17" rx="8" fill="#1e293b"/>
